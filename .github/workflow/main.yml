name: CI/CD for cozystay (Direct .tar Transfer)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:

      # 1) 코드 체크아웃 및 JDK 21 설정
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2) Gradle 빌드 (JAR 파일 생성)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 3) 도커 이미지 빌드 및 .tar 파일로 저장
      - name: Build and Save Docker Image
        run: |
          docker build -t cozystay-app .
          docker save -o cozystay.tar cozystay-app

      # 4) SCP를 이용해 .tar 파일을 EC2로 전송
      - name: Copy .tar file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          source: "cozystay.tar"
          target: "/home/ubuntu/"

      # 5) EC2에서 이미지 로드 및 컨테이너 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          script: |
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop cozystay || true
            sudo docker rm cozystay || true
            
            # .tar 파일로부터 이미지 불러오기
            sudo docker load -i /home/ubuntu/cozystay.tar
            
            # 새 컨테이너 실행 (성공했던 RDS 설정 반영)
            sudo docker run -d -p 8080:8080 \
              --name cozystay \
              -e SPRING_DATASOURCE_URL='${{ secrets.RDS_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.RDS_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.RDS_PASSWORD }}' \
              cozystay-app
            
            # 용량 관리를 위해 전송된 .tar 파일 삭제
            rm /home/ubuntu/cozystay.tar
            
            # 사용하지 않는 오래된 이미지 정리
            sudo docker image prune -f
