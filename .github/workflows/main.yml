name: CI/CD for cozystay (Using YML Secret)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    steps:

      # 1) 코드 가져오기 및 JDK 21 설정
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 2) 환경별 yml 파일 생성 (매우 중요!)
      # JAR 빌드 전에 src/main/resources 폴더에 파일을 만듭니다.
      - name: make application-prod.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.YML_PROD }}" > ./src/main/resources/application-prod.yml
        shell: bash

      # 3) Gradle 빌드 (이제 application-prod.yml이 JAR 안에 포함됨)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 4) 도커 이미지 빌드 및 .tar 저장
      - name: Build and Save Docker Image
        run: |
          docker logout
          docker build -t cozystay-app .
          docker save -o cozystay.tar cozystay-app

      # 5) SCP로 .tar 파일 전송
      - name: Copy .tar file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          source: "cozystay.tar"
          target: "/home/ubuntu/"

      # 6) EC2 배포 및 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}
          script: |
            sudo docker stop cozystay || true
            sudo docker rm cozystay || true
            
            sudo docker load -i /home/ubuntu/cozystay.tar
            
            # -e 옵션 대신 프로필 설정 한 줄로 끝!
            sudo docker run -d -p 8080:8080 \
              --name cozystay \
              -e SPRING_PROFILES_ACTIVE=prod \
              cozystay-app
            
            rm /home/ubuntu/cozystay.tar
            sudo docker image prune -f
